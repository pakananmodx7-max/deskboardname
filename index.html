<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="KrunameClass ระบบจัดการชั้นเรียน — เช็คชื่อ งาน คะแนน และสแกน QR ส่งงาน" />
    <meta name="theme-color" content="#237fc8" />
    <!-- Installed app (iOS "Add to Home Screen" / Android): standalone, own title. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KrunameClass" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>KrunameClass | ระบบจัดการชั้นเรียน</title>
    <style>
      /* Startup splash backdrop: painted right away, before the app's script
         loads, and reused by the React splash (src/features/startup) as its
         static / no-WebGL background. */
      .kc-splash-backdrop {
        background-color: #c3d3fb;
        background-image:
          radial-gradient(70% 45% at 92% 12%, rgb(176 150 248 / 0.7), transparent 70%),
          radial-gradient(75% 40% at 0% 38%, rgb(140 214 250 / 0.75), transparent 70%),
          radial-gradient(85% 45% at 100% 62%, rgb(170 146 246 / 0.6), transparent 72%),
          radial-gradient(80% 40% at 10% 88%, rgb(150 226 248 / 0.7), transparent 70%),
          radial-gradient(60% 35% at 60% 100%, rgb(176 150 248 / 0.55), transparent 70%),
          linear-gradient(165deg, #d6e3ff 0%, #c6d6fb 45%, #d3cbfa 100%);
      }
      #root > .kc-splash-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="kc-splash-backdrop kc-splash-boot"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
